<!DOCTYPE html>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; height: 100dvh; }
  body {
    height: 100%; height: 100dvh;
    background: #E8DCC8;
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  #root {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  ::-webkit-scrollbar { width: 0; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }

  /* While a bottom sheet / modal is open, hide the bottom nav so the sheet's
     action buttons don't collide with the floating FAB ("+ Agregar comida"). */
  body.kcalia-modal-open .kcalia-bottom-nav { display: none !important; }

  /* ── Mobile / PWA: fill the entire screen ── */
  @media (max-width: 600px) {
    html, body {
      background: #FEFAF3;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    #root {
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
  }

  /* ── Dark theme ──
     Pastel accent backgrounds (gold-soft, protein, fat, etc.) get darker
     siblings so cards that previously used hardcoded "#FFF3C4" don't render
     as bright pastel splotches over a dark UI. The accent line color (e.g.
     gold #F5C030) stays roughly the same so meal/macro identity is preserved.
  */
  body.dark { background: #1A1208; }
  body.dark .phone-shell {
    background: #1E1408 !important;
    --bg-main: #1E1408;
    --bg-card: #2A1E10;
    --bg-card2: #332512;
    --color-text: #F5EFE4;
    --color-sub: #C8B89A;
    --color-muted: #8A7868;
    --border-color: #3A2C1E;
    --bg-input: #2A1E10;
    --accent-gold: #F5C030;
    --accent-gold-soft: #3A2C0E;
    --accent-gold-text: #FFE682;
    --accent-protein: #7EC8E3;
    --accent-protein-soft: #1A2E38;
    --accent-fat: #C5A3FF;
    --accent-fat-soft: #2A1F3D;
    --accent-carbs: #FF8C69;
    --accent-carbs-soft: #3D1F14;
    --accent-sugar: #FFB3C6;
    --accent-sugar-soft: #3D1F26;
    --accent-success: #6BCB77;
    --accent-success-soft: #1A2E1F;
    --accent-success-text: #9AE5A4;
    --accent-danger: #FF6B6B;
    --accent-danger-soft: #3D1A1A;
    --accent-danger-text: #FFA0A0;
  }
  body.dark .phone-shell input,
  body.dark .phone-shell textarea {
    background: var(--bg-input);
    color: var(--color-text);
    border-color: var(--border-color);
  }
  body:not(.dark) {
    --bg-main: #FEFAF3;
    --bg-card: #ffffff;
    --bg-card2: #F5EFE4;
    --color-text: #1E1408;
    --color-sub: #7A6652;
    --color-muted: #9A8878;
    --border-color: #EAE0D0;
    --bg-input: #ffffff;
    --accent-gold: #F5C030;
    --accent-gold-soft: #FFF3C4;
    --accent-gold-text: #9A6D00;
    --accent-protein: #7EC8E3;
    --accent-protein-soft: #DFF3FA;
    --accent-fat: #C5A3FF;
    --accent-fat-soft: #EFE4FF;
    --accent-carbs: #FF8C69;
    --accent-carbs-soft: #FFE4DB;
    --accent-sugar: #FFB3C6;
    --accent-sugar-soft: #FFE8EF;
    --accent-success: #6BCB77;
    --accent-success-soft: #D8F5DB;
    --accent-success-text: #2A7D3A;
    --accent-danger: #FF6B6B;
    --accent-danger-soft: #FFE0E0;
    --accent-danger-text: #C03030;
  }
</style>

<script>
  // Apply dark theme immediately to avoid flash. Read from the main kcalia_v1
  // envelope; fall back to the legacy 'kcalia_dark_theme' key during the
  // migration window so users upgrading from older builds don't lose their pref.
  (function() {
    try {
      var raw = localStorage.getItem('kcalia_v1');
      var dark = false;
      if (raw) {
        var parsed = JSON.parse(raw);
        var data = (parsed && parsed._v) ? parsed.data : parsed;
        if (data && typeof data.darkTheme === 'boolean') dark = data.darkTheme;
      }
      if (!dark) {
        // Legacy key — read once, will be migrated into the envelope on next save.
        var legacy = localStorage.getItem('kcalia_dark_theme');
        if (legacy) dark = !!JSON.parse(legacy);
      }
      if (dark) document.body.classList.add('dark');
    } catch(e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>

<script src="Constants.jsx"></script>
<script src="AppShell.jsx"></script>
<script src="Dashboard.jsx"></script>
<script src="AddMeal.jsx"></script>
<script src="Progress.jsx"></script>
<script src="Profile.jsx"></script>
<script src="Onboarding.jsx"></script>
<script src="FoodLibrary.jsx"></script>
<script src="WeeklyAnalysis.jsx"></script>
<script src="Notifications.jsx"></script>
<script src="WaterTracker.jsx"></script>

<script>
const { useState, useEffect, useMemo } = React;

// ── localStorage helpers ──────────────────────────────────────────
const STORAGE_KEY = 'kcalia_v1';
const SCHEMA_VERSION = 3;

function _pruneOldByDate(arr, monthsBack = 6) {
  if (!Array.isArray(arr)) return [];
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - monthsBack);
  return arr.filter(m => {
    try { return new Date(m.date) >= cutoff; } catch { return false; }
  });
}

function _pruneOldLogs(dailyLog) {
  return _pruneOldByDate(dailyLog, 6);
}

// v3: migrate entry.date from Date.toDateString() ("Mon May 09 2026") to a
// stable "YYYY-MM-DD" local-date key so day comparisons stop drifting with
// timezone changes. Old entries are converted using new Date() parsing, which
// handles the toDateString format reliably in all browsers.
function _migrateDates(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(m => {
    if (!m || !m.date) return m;
    if (/^\d{4}-\d{2}-\d{2}$/.test(m.date)) return m;
    const newKey = localDateKey(m.date);
    return newKey ? { ...m, date: newKey } : m;
  });
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    // Schema migration: v1 had no version field
    if (!parsed || typeof parsed !== 'object') return null;
    const data = parsed._v ? parsed.data : parsed; // unwrap versioned envelope if present
    if (data && data.dailyLog) {
      data.dailyLog = _migrateDates(data.dailyLog);
      data.dailyLog = _pruneOldLogs(data.dailyLog);
    }
    if (data && data.waterLog) {
      data.waterLog = _migrateDates(data.waterLog);
      data.waterLog = _pruneOldByDate(data.waterLog, 6);
    }
    return data;
  } catch { return null; }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ _v: SCHEMA_VERSION, data: state }));
  } catch(e) {
    // localStorage full — prune aggressively and retry
    try {
      const pruned = {
        ...state,
        dailyLog: _pruneOldLogs(state.dailyLog).slice(-90),
        waterLog: _pruneOldByDate(state.waterLog, 3).slice(-200),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ _v: SCHEMA_VERSION, data: pruned }));
    } catch {}
  }
}

// ── Screen config ─────────────────────────────────────────────────
const FULLSCREEN = new Set(['onboarding', 'add', 'weekly', 'notifications']);

function PhoneShell({ screen, children }) {
  const mobile = useIsMobile();
  return React.createElement('div', {
    className: 'phone-shell',
    style: {
      width: mobile ? '100%' : 390,
      height: mobile ? '100dvh' : 844,
      maxHeight: mobile ? '100dvh' : 'none',
      background: '#FEFAF3',
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
      borderRadius: mobile ? 0 : 40,
      boxShadow: mobile ? 'none' : '0 24px 80px rgba(30,20,8,0.22)',
      position: mobile ? 'fixed' : 'relative',
      top: mobile ? 0 : 'auto',
      left: mobile ? 0 : 'auto',
      right: mobile ? 0 : 'auto',
      bottom: mobile ? 0 : 'auto',
    }
  },
    React.createElement(StatusBarSpacer),
    screen !== 'onboarding' && !mobile && React.createElement(StatusBar),
    React.createElement('div', { style: { flex: 1, overflowY: 'auto', overflowX: 'hidden' } },
      children
    )
  );
}

// ── Main App ──────────────────────────────────────────────────────
function App() {
  // Load persisted state
  const saved = loadState();

  const [screen,      setScreen]      = useState(saved && saved.userData ? 'dashboard' : 'onboarding');
  const [userData,    setUserData]    = useState(saved ? saved.userData    : null);
  const [dailyGoals,  setDailyGoals]  = useState(saved ? saved.dailyGoals  : { ...DEFAULT_DAILY_GOALS });
  const [dailyLog,    setDailyLog]    = useState(saved ? saved.dailyLog    : []);
  const [foodLibrary, setFoodLibrary] = useState(saved && saved.foodLibrary ? saved.foodLibrary.filter(f => f.custom) : []);
  const [navMealName, setNavMealName] = useState('');
  const [addMealKey,  setAddMealKey]  = useState(0);
  const [savedCart,   setSavedCart]   = useState([]);
  const [prevScreen,  setPrevScreen]  = useState('dashboard');
  const [editingMealId, setEditingMealId] = useState(null);
  const [notifications, setNotifications] = useState(saved && saved.notifications ? saved.notifications : []);
  // Merge stored prefs with defaults so users upgrading from a build that
  // didn't have a given toggle (e.g. waterReminders) get the new option in
  // its default-on state instead of silently disabled.
  const [notifPrefs, setNotifPrefs] = useState(
    saved && saved.notifPrefs
      ? { ...DEFAULT_NOTIF_PREFS, ...saved.notifPrefs }
      : DEFAULT_NOTIF_PREFS
  );
  const [waterLog, setWaterLog]   = useState(saved && saved.waterLog  ? saved.waterLog  : []);
  const [waterGoal, setWaterGoal] = useState(saved && saved.waterGoal ? saved.waterGoal : 2000);
  const [waterPresets, setWaterPresets] = useState(saved && saved.waterPresets ? saved.waterPresets : null);
  const [consumptionLimits, setConsumptionLimits] = useState(saved && saved.consumptionLimits ? saved.consumptionLimits : []);
  const [consumptionLog,    setConsumptionLog]    = useState(saved && saved.consumptionLog    ? saved.consumptionLog    : []);
  const [darkTheme, setDarkTheme] = useState(() => {
    if (saved && typeof saved.darkTheme === 'boolean') return saved.darkTheme;
    // One-time migration from the legacy standalone key, then remove it.
    try {
      const legacy = localStorage.getItem('kcalia_dark_theme');
      if (legacy != null) {
        localStorage.removeItem('kcalia_dark_theme');
        return !!JSON.parse(legacy);
      }
    } catch {}
    return false;
  });

  // Keep body.dark in sync with state. The head script already applied the
  // initial class to avoid flash, this handles toggles during the session.
  useEffect(() => {
    if (darkTheme) document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  }, [darkTheme]);

  // Show an "update available" banner when the SW registration script detects
  // a newly installed worker. Reload picks up the fresh JSX/HTML from the new cache.
  const [updateReady, setUpdateReady] = useState(false);
  useEffect(() => {
    function onUpdate() { setUpdateReady(true); }
    window.addEventListener('kcalia-sw-update', onUpdate);
    return () => window.removeEventListener('kcalia-sw-update', onUpdate);
  }, []);

  // Persist with debounce to avoid writing on every keystroke
  useEffect(() => {
    const t = setTimeout(() => {
      saveState({ userData, dailyGoals, dailyLog, foodLibrary, notifications, notifPrefs, waterLog, waterGoal, waterPresets, consumptionLimits, consumptionLog, darkTheme });
    }, 500);
    return () => clearTimeout(t);
  }, [userData, dailyGoals, dailyLog, foodLibrary, notifications, notifPrefs, waterLog, waterGoal, waterPresets, consumptionLimits, consumptionLog, darkTheme]);

  function navigate(s, mealName = '') {
    if (s === 'add') {
      if (mealName) {
        // Fresh meal started from dashboard shortcut
        setNavMealName(mealName);
        setSavedCart([]);
        setEditingMealId(null);
        setAddMealKey(k => k + 1);
      } else if (screen !== 'library') {
        // Navigating to add from anywhere except library: reset cart
        setNavMealName('');
        setSavedCart([]);
        setEditingMealId(null);
        setAddMealKey(k => k + 1);
      }
      // Returning from library → keep navMealName, savedCart and editing state intact
    } else {
      if (s !== 'library') setNavMealName('');
      if (s === 'dashboard') { setSavedCart([]); setEditingMealId(null); setPrevScreen('dashboard'); }
    }
    setScreen(s);
  }

  // Open AddMeal in edit mode for an existing meal: prefill cart and name.
  // The original meal's date/time are preserved by handleUpdateMeal on save.
  function startEditMeal(meal) {
    setNavMealName(meal.name || '');
    setSavedCart(meal.foods || []);
    setEditingMealId(meal.id);
    setAddMealKey(k => k + 1);
    setPrevScreen('dashboard');
    setScreen('add');
  }

  function handleOnboardingComplete(data, suggestedGoals) {
    setUserData(data);
    if (suggestedGoals) setDailyGoals(suggestedGoals);
    setScreen('dashboard');
  }

  function handleAddMeal(meal) {
    setDailyLog(prev => [...prev, meal]);
  }

  function handleUpdateMeal(updatedMeal) {
    // Spread the original entry first so date/time are kept; updatedMeal overrides
    // name/foods/totals/id but doesn't carry date/time fields.
    setDailyLog(prev => prev.map(m => m.id === updatedMeal.id ? { ...m, ...updatedMeal } : m));
  }

  function handleDeleteMeal(id) {
    setDailyLog(prev => prev.filter(m => m.id !== id));
  }

  function handleUpdateLibrary(newLibrary) {
    setFoodLibrary(newLibrary);
  }

  function handleUpdateGoals(newGoals) {
    setDailyGoals(newGoals);
  }

  function handleUpdateUserData(updater) {
    setUserData(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      return next;
    });
  }

  // Confirmation is handled by an in-app modal in Profile.jsx, so this just
  // wipes state. Triggers must guard with their own confirm UI.
  function handleLogout() {
    localStorage.removeItem(STORAGE_KEY);
    setUserData(null);
    setDailyLog([]);
    setDailyGoals({ ...DEFAULT_DAILY_GOALS });
    setFoodLibrary([]);
    setNotifications([]);
    setNotifPrefs(DEFAULT_NOTIF_PREFS);
    setWaterLog([]);
    setWaterGoal(2000);
    setWaterPresets(null);
    setConsumptionLimits([]);
    setConsumptionLog([]);
    setDarkTheme(false);
    setScreen('onboarding');
  }

  // Export the full app state to a JSON file the user can save anywhere
  // (cloud drive, AirDrop, email-to-self). The envelope mirrors what saveState
  // writes to localStorage so importing it back is a straight replace.
  function handleExportData() {
    try {
      const payload = {
        _v: SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        data: { userData, dailyGoals, dailyLog, foodLibrary, notifications, notifPrefs, waterLog, waterGoal, waterPresets, consumptionLimits, consumptionLog, darkTheme },
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kcalia-backup-${localDateKey(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e && e.message ? e.message : 'Error exportando' };
    }
  }

  // Replace the current state with the contents of an exported file. We
  // accept both the v3 envelope ({ _v, data }) and a raw state object from
  // older manual backups so users aren't locked out by format drift.
  function handleImportData(file) {
    return new Promise((resolve) => {
      try {
        const reader = new FileReader();
        reader.onerror = () => resolve({ ok: false, error: 'No se pudo leer el archivo.' });
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (!parsed || typeof parsed !== 'object') throw new Error('Archivo inválido.');
            const d = parsed._v ? parsed.data : parsed;
            if (!d || typeof d !== 'object') throw new Error('Estructura inválida.');
            if (d.userData)             setUserData(d.userData);
            if (d.dailyGoals)           setDailyGoals(d.dailyGoals);
            if (Array.isArray(d.dailyLog))    setDailyLog(d.dailyLog);
            if (Array.isArray(d.foodLibrary)) setFoodLibrary(d.foodLibrary.filter(f => f && f.custom));
            if (Array.isArray(d.notifications)) setNotifications(d.notifications);
            if (d.notifPrefs)           setNotifPrefs({ ...DEFAULT_NOTIF_PREFS, ...d.notifPrefs });
            if (Array.isArray(d.waterLog))    setWaterLog(d.waterLog);
            if (typeof d.waterGoal === 'number') setWaterGoal(d.waterGoal);
            if (Array.isArray(d.waterPresets) || d.waterPresets === null) setWaterPresets(d.waterPresets);
            if (Array.isArray(d.consumptionLimits)) setConsumptionLimits(d.consumptionLimits);
            if (Array.isArray(d.consumptionLog))    setConsumptionLog(d.consumptionLog);
            if (typeof d.darkTheme === 'boolean') setDarkTheme(d.darkTheme);
            if (d.userData) setScreen('dashboard');
            resolve({ ok: true });
          } catch (err) {
            resolve({ ok: false, error: err && err.message ? err.message : 'Archivo inválido.' });
          }
        };
        reader.readAsText(file);
      } catch (e) {
        resolve({ ok: false, error: e && e.message ? e.message : 'Error importando.' });
      }
    });
  }

  // ── Water tracking helpers ──
  function handleAddWater(ml) {
    const now = new Date();
    setWaterLog(prev => [...prev, {
      id: uniqueId(),
      date: localDateKey(now),
      ml,
      time: now.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }),
    }]);
  }
  function handleUndoLastWater() {
    setWaterLog(prev => {
      const todayKey = localDateKey(new Date());
      // Remove only the last entry for today, so undoing doesn't reach into
      // yesterday's history if the user opens the app early in the morning.
      for (let i = prev.length - 1; i >= 0; i--) {
        if (prev[i].date === todayKey) {
          return [...prev.slice(0, i), ...prev.slice(i + 1)];
        }
      }
      return prev;
    });
  }
  function handleUpdateWaterGoal(ml) {
    setWaterGoal(Math.max(500, Math.min(6000, ml)));
  }
  function handleUpdateWaterPresets(newPresets) {
    setWaterPresets(newPresets);
  }
  function handleUpdateConsumptionLimits(newLimits) {
    setConsumptionLimits(newLimits);
    const ids = new Set(newLimits.map(l => l.id));
    setConsumptionLog(prev => prev.filter(e => ids.has(e.limitId)));
  }
  function handleAddConsumption(limitId) {
    setConsumptionLog(prev => [...prev, { id: uniqueId(), limitId, date: localDateKey(new Date()) }]);
  }
  function handleUndoConsumption(limitId) {
    setConsumptionLog(prev => {
      for (let i = prev.length - 1; i >= 0; i--) {
        if (prev[i].limitId === limitId) return [...prev.slice(0, i), ...prev.slice(i + 1)];
      }
      return prev;
    });
  }

  // ── Notification helpers ──
  function handleMarkRead(id) {
    setNotifications(prev => prev.map(n => n.id === id ? { ...n, read: true } : n));
  }
  function handleMarkAllRead() {
    setNotifications(prev => prev.map(n => ({ ...n, read: true })));
  }
  function handleClearAll() {
    setNotifications([]);
  }
  function handleNotifAction(action) {
    if (action.screen) navigate(action.screen, action.mealName || '');
  }
  function handleUpdateNotifPrefs(newPrefs) {
    setNotifPrefs(newPrefs);
  }

  // Re-render at local midnight so "today" rolls over without leaving stale
  // meals visible. Keeps a tick state that bumps each new day.
  //
  // Two trigger paths:
  // 1. setTimeout to next local midnight, for the case where the app stays
  //    open across the boundary. Tab-throttling can skew this by minutes but
  //    not by hours, which is good enough.
  // 2. visibilitychange + the existing today-key comparison — if the device
  //    suspended overnight, the setTimeout may have been frozen and fired
  //    late. When the user returns we check whether the day rolled over and
  //    bump immediately so yesterday's meals don't linger on Dashboard.
  const [dayTick, setDayTick] = useState(0);
  const dayKeyRef = React.useRef(localDateKey(new Date()));
  useEffect(() => {
    const now = new Date();
    const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
    const ms = nextMidnight - now;
    const t = setTimeout(() => {
      dayKeyRef.current = localDateKey(new Date());
      setDayTick(n => n + 1);
    }, ms);
    function onVisibility() {
      if (document.visibilityState !== 'visible') return;
      const nowKey = localDateKey(new Date());
      if (nowKey !== dayKeyRef.current) {
        dayKeyRef.current = nowKey;
        setDayTick(n => n + 1);
      }
    }
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      clearTimeout(t);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [dayTick]);

  // dayTick bumps at local midnight so "today" rolls over even if the user
  // leaves the app open overnight. Including it in the deps forces these
  // memos to recompute when the day changes.
  const today = useMemo(() => localDateKey(new Date()), [dayTick]);
  const todayMeals   = useMemo(() => dailyLog.filter(m => m.date === today),  [dailyLog, today]);
  const todayWater   = useMemo(() => waterLog.filter(w => w.date === today),  [waterLog, today]);
  const todayWaterMl = useMemo(() => todayWater.reduce((s, w) => s + (w.ml || 0), 0), [todayWater]);
  const unreadCount  = useMemo(() => notifications.filter(n => !n.read).length, [notifications]);

  // Generate notifications on load and periodically.
  // Pause the interval while the tab is hidden so we don't burn cycles checking
  // reminders in the background, and re-run immediately when it becomes visible.
  // Use a ref to access latest state inside the interval without resetting it
  // every time meals/goals/notifications change (which would skip the timer).
  const genRef = React.useRef(null);
  genRef.current = () => {
    if (!userData || !notifPrefs || !notifPrefs.enabled) return;
    const newNotifs = generateAppNotifications(todayMeals, dailyGoals, dailyLog, userData, notifications, notifPrefs, todayWaterMl, waterGoal);
    if (newNotifs.length > 0) setNotifications(prev => [...newNotifs, ...prev].slice(0, 50));
  };
  useEffect(() => {
    if (!userData) return;
    function runGen() { if (genRef.current) genRef.current(); }
    let iv = null;
    function start() {
      if (iv) return;
      runGen();
      iv = setInterval(runGen, 5 * 60 * 1000);
    }
    function stop() {
      if (iv) { clearInterval(iv); iv = null; }
    }
    function onVisibility() {
      if (document.visibilityState === 'visible') start();
      else stop();
    }
    if (document.visibilityState === 'visible') start();
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      document.removeEventListener('visibilitychange', onVisibility);
      stop();
    };
    // Only re-run on login/logout transitions, not on every field change in
    // userData. A name rename shouldn't tear down and re-create the interval.
  }, [!!userData]);

  // Prepare food list for AddMeal: custom library first, then DB foods not already in library.
  // Memoized so the ~200-entry array isn't rebuilt on every parent render
  // (e.g. every keystroke in any unrelated text input would otherwise reflow it).
  const addMealFoods = useMemo(() => {
    function toAddMealFormat(f) {
      const isG = f.unit === 'g';
      return {
        ...f,
        portion: f.portion || (isG ? '100g' : '1 unidad'),
        kcal:    isG ? Math.round((f.kcalPerG || f.kcal) * 100) : f.kcal,
        protein: isG ? parseFloat((f.protein * 100).toFixed(1)) : f.protein,
        fat:     isG ? parseFloat((f.fat     * 100).toFixed(1)) : f.fat,
        carbs:   isG ? parseFloat((f.carbs   * 100).toFixed(1)) : f.carbs,
        sugar:   isG ? parseFloat((f.sugar   * 100).toFixed(1)) : f.sugar,
        kcalPerG: isG ? (f.kcalPerG || f.kcal) : null,
      };
    }
    const customMealFoods = foodLibrary.map(toAddMealFormat);
    const customNames = new Set(foodLibrary.map(f => f.name.toLowerCase()));
    const dbMealFoods = (window.DB_FOODS || [])
      .filter(f => !customNames.has(f.name.toLowerCase()))
      .map(toAddMealFormat);
    return [...customMealFoods, ...dbMealFoods];
  }, [foodLibrary]);

  function renderContent() {
    switch (screen) {
      case 'onboarding':
        return React.createElement(Onboarding, { onComplete: handleOnboardingComplete });

      case 'notifications':
        return React.createElement(NotificationCenter, {
          notifications,
          onMarkRead: handleMarkRead,
          onMarkAllRead: handleMarkAllRead,
          onClearAll: handleClearAll,
          onAction: handleNotifAction,
          onBack: () => navigate('dashboard'),
          onOpenSettings: () => navigate('profile'),
        });

      case 'add':
        return React.createElement(AddMeal, {
          key:           addMealKey,
          onBack:        () => navigate('dashboard'),
          onAddMeal:     handleAddMeal,
          onUpdateMeal:  handleUpdateMeal,
          onGoToLibrary: (cartSnapshot) => { setSavedCart(cartSnapshot); setPrevScreen('add'); navigate('library'); },
          mealName:      navMealName,
          foodLibrary:   addMealFoods,
          initialCart:   savedCart,
          editingMealId,
        });

      case 'library':
        return React.createElement(FoodLibrary, {
          onBack:          () => navigate(prevScreen === 'add' ? 'add' : 'dashboard'),
          library:         foodLibrary,
          onUpdateLibrary: handleUpdateLibrary,
        });

      case 'weekly':
        return React.createElement(WeeklyAnalysis, {
          onBack:         () => navigate('progress'),
          dailyLog,
          dailyGoals,
          userData,
          onUpdateGoals:  handleUpdateGoals,
        });

      case 'progress':
        return React.createElement('div', null,
          React.createElement(Progress, { dailyLog, dailyGoals }),
          React.createElement('div', { style: { padding: '0 16px 20px' } },
            React.createElement('button', {
              onClick: () => navigate('weekly'),
              style: { width: '100%', background: 'white', border: '1.5px solid #EAE0D0', borderRadius: 999, padding: '13px', fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, color: '#1E1408', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }
            },
              React.createElement('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: '#F5D040', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                React.createElement('polyline', { points: '22 12 18 12 15 21 9 3 6 12 2 12' })
              ),
              'Ver análisis semanal'
            )
          )
        );

      case 'profile':
        return React.createElement(Profile, {
          userData,
          dailyGoals,
          onUpdateGoals:    handleUpdateGoals,
          onNavigate:       navigate,
          onLogout:         handleLogout,
          onUpdateUserData: handleUpdateUserData,
          notifPrefs,
          onUpdateNotifPrefs: handleUpdateNotifPrefs,
          waterGoal,
          onUpdateWaterGoal: handleUpdateWaterGoal,
          darkTheme,
          onUpdateDarkTheme: setDarkTheme,
          consumptionLimits,
          onUpdateConsumptionLimits: handleUpdateConsumptionLimits,
          onExportData: handleExportData,
          onImportData: handleImportData,
        });

      default: // dashboard
        return React.createElement(Dashboard, {
          onNavigate:   navigate,
          userData,
          todayMeals,
          dailyGoals,
          unreadCount,
          onDeleteMeal: handleDeleteMeal,
          onEditMeal:   startEditMeal,
          todayWaterMl,
          waterGoal,
          onAddWater:        handleAddWater,
          onUndoLastWater:   handleUndoLastWater,
          onUpdateWaterGoal: handleUpdateWaterGoal,
          waterPresets,
          onUpdateWaterPresets: handleUpdateWaterPresets,
          consumptionLimits,
          consumptionLog,
          onAddConsumption:  handleAddConsumption,
          onUndoConsumption: handleUndoConsumption,
        });
    }
  }

  const updateBanner = updateReady && React.createElement('div', {
    role: 'status',
    style: {
      position: 'fixed', left: '50%', transform: 'translateX(-50%)',
      bottom: 'calc(env(safe-area-inset-bottom, 0px) + 90px)',
      background: '#1E1408', color: '#FFF3C4',
      borderRadius: 999, padding: '10px 14px 10px 18px',
      boxShadow: '0 8px 24px rgba(30,20,8,0.35)',
      display: 'flex', alignItems: 'center', gap: 10,
      fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 600,
      zIndex: 200, maxWidth: 'calc(100% - 32px)',
    }
  },
    React.createElement('span', null, '✨ Nueva versión disponible'),
    React.createElement('button', {
      onClick: () => window.location.reload(),
      type: 'button',
      style: { background: '#F5D040', color: '#1E1408', border: 'none', borderRadius: 999, padding: '7px 14px', fontWeight: 700, cursor: 'pointer', font: 'inherit', minHeight: 36 }
    }, 'Recargar'),
    React.createElement('button', {
      onClick: () => setUpdateReady(false),
      type: 'button',
      'aria-label': 'Cerrar aviso',
      style: { background: 'transparent', color: '#FFF3C4', border: 'none', cursor: 'pointer', fontSize: 18, lineHeight: 1, padding: '0 4px', font: 'inherit' }
    }, '×')
  );

  if (FULLSCREEN.has(screen)) {
    return React.createElement(React.Fragment, null,
      React.createElement(PhoneShell, { screen }, renderContent()),
      updateBanner,
    );
  }

  return React.createElement(React.Fragment, null,
    React.createElement(AppShell, { screen, onNavigate: navigate }, renderContent()),
    updateBanner,
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

<script>
  // Register the SW and watch for updates so a PWA that's already installed
  // can prompt the user to pick up new JSX/HTML on the next deploy instead of
  // staying stuck on the old cached build until they manually close/reopen.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        // Skip the prompt on the very first install (no controller = first visit).
        if (!navigator.serviceWorker.controller) return;
        function watchInstalling(worker) {
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed') {
              window.dispatchEvent(new CustomEvent('kcalia-sw-update'));
            }
          });
        }
        if (reg.waiting) window.dispatchEvent(new CustomEvent('kcalia-sw-update'));
        reg.addEventListener('updatefound', () => watchInstalling(reg.installing));
        // Check for updates when the tab regains focus, so a long-lived PWA
        // catches new builds without waiting for the next cold start.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
