<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KCALIA — App Nutricional</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KCALIA">
<meta name="theme-color" content="#F5D040">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; height: 100dvh; }
  body {
    height: 100%; height: 100dvh;
    background: #E8DCC8;
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  #root {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  ::-webkit-scrollbar { width: 0; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }

  /* ── Mobile / PWA: fill the entire screen ── */
  @media (max-width: 600px) {
    html, body {
      background: #FEFAF3;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    #root {
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
  }

  /* ── Dark theme ──
     Pastel accent backgrounds (gold-soft, protein, fat, etc.) get darker
     siblings so cards that previously used hardcoded "#FFF3C4" don't render
     as bright pastel splotches over a dark UI. The accent line color (e.g.
     gold #F5C030) stays roughly the same so meal/macro identity is preserved.
  */
  body.dark { background: #1A1208; }
  body.dark .phone-shell {
    background: #1E1408 !important;
    --bg-main: #1E1408;
    --bg-card: #2A1E10;
    --bg-card2: #332512;
    --color-text: #F5EFE4;
    --color-sub: #C8B89A;
    --color-muted: #8A7868;
    --border-color: #3A2C1E;
    --bg-input: #2A1E10;
    --accent-gold: #F5C030;
    --accent-gold-soft: #3A2C0E;
    --accent-gold-text: #FFE682;
    --accent-protein: #7EC8E3;
    --accent-protein-soft: #1A2E38;
    --accent-fat: #C5A3FF;
    --accent-fat-soft: #2A1F3D;
    --accent-carbs: #FF8C69;
    --accent-carbs-soft: #3D1F14;
    --accent-sugar: #FFB3C6;
    --accent-sugar-soft: #3D1F26;
    --accent-success: #6BCB77;
    --accent-success-soft: #1A2E1F;
    --accent-success-text: #9AE5A4;
    --accent-danger: #FF6B6B;
    --accent-danger-soft: #3D1A1A;
    --accent-danger-text: #FFA0A0;
  }
  body.dark .phone-shell input,
  body.dark .phone-shell textarea {
    background: var(--bg-input);
    color: var(--color-text);
    border-color: var(--border-color);
  }
  body:not(.dark) {
    --bg-main: #FEFAF3;
    --bg-card: #ffffff;
    --bg-card2: #F5EFE4;
    --color-text: #1E1408;
    --color-sub: #7A6652;
    --color-muted: #9A8878;
    --border-color: #EAE0D0;
    --bg-input: #ffffff;
    --accent-gold: #F5C030;
    --accent-gold-soft: #FFF3C4;
    --accent-gold-text: #9A6D00;
    --accent-protein: #7EC8E3;
    --accent-protein-soft: #DFF3FA;
    --accent-fat: #C5A3FF;
    --accent-fat-soft: #EFE4FF;
    --accent-carbs: #FF8C69;
    --accent-carbs-soft: #FFE4DB;
    --accent-sugar: #FFB3C6;
    --accent-sugar-soft: #FFE8EF;
    --accent-success: #6BCB77;
    --accent-success-soft: #D8F5DB;
    --accent-success-text: #2A7D3A;
    --accent-danger: #FF6B6B;
    --accent-danger-soft: #FFE0E0;
    --accent-danger-text: #C03030;
  }
</style>

<script>
  // Apply dark theme immediately to avoid flash
  (function() {
    try {
      if (JSON.parse(localStorage.getItem('kcalia_dark_theme'))) {
        document.body.classList.add('dark');
      }
    } catch(e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>

<script src="Constants.jsx"></script>
<script src="AppShell.jsx"></script>
<script src="Dashboard.jsx"></script>
<script src="AddMeal.jsx"></script>
<script src="Progress.jsx"></script>
<script src="Profile.jsx"></script>
<script src="Onboarding.jsx"></script>
<script src="FoodLibrary.jsx"></script>
<script src="WeeklyAnalysis.jsx"></script>
<script src="Notifications.jsx"></script>

<script>
const { useState, useEffect } = React;

// ── localStorage helpers ──────────────────────────────────────────
const STORAGE_KEY = 'kcalia_v1';
const SCHEMA_VERSION = 3;

function _pruneOldLogs(dailyLog) {
  if (!Array.isArray(dailyLog)) return [];
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 6);
  return dailyLog.filter(m => {
    try { return new Date(m.date) >= cutoff; } catch { return false; }
  });
}

// v3: migrate meal.date from Date.toDateString() ("Mon May 09 2026") to a
// stable "YYYY-MM-DD" local-date key so day comparisons stop drifting with
// timezone changes. Old entries are converted using new Date() parsing, which
// handles the toDateString format reliably in all browsers.
function _migrateDates(dailyLog) {
  if (!Array.isArray(dailyLog)) return [];
  return dailyLog.map(m => {
    if (!m || !m.date) return m;
    if (/^\d{4}-\d{2}-\d{2}$/.test(m.date)) return m;
    const newKey = localDateKey(m.date);
    return newKey ? { ...m, date: newKey } : m;
  });
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    // Schema migration: v1 had no version field
    if (!parsed || typeof parsed !== 'object') return null;
    const data = parsed._v ? parsed.data : parsed; // unwrap versioned envelope if present
    if (data && data.dailyLog) {
      data.dailyLog = _migrateDates(data.dailyLog);
      data.dailyLog = _pruneOldLogs(data.dailyLog);
    }
    return data;
  } catch { return null; }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ _v: SCHEMA_VERSION, data: state }));
  } catch(e) {
    // localStorage full — prune aggressively and retry
    try {
      const pruned = { ...state, dailyLog: _pruneOldLogs(state.dailyLog).slice(-90) };
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ _v: SCHEMA_VERSION, data: pruned }));
    } catch {}
  }
}

// ── Screen config ─────────────────────────────────────────────────
const FULLSCREEN = new Set(['onboarding', 'add', 'weekly', 'notifications']);

function PhoneShell({ screen, children }) {
  const mobile = _isMobile();
  return React.createElement('div', {
    className: 'phone-shell',
    style: {
      width: mobile ? '100%' : 390,
      height: mobile ? '100dvh' : 844,
      maxHeight: mobile ? '100dvh' : 'none',
      background: '#FEFAF3',
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
      borderRadius: mobile ? 0 : 40,
      boxShadow: mobile ? 'none' : '0 24px 80px rgba(30,20,8,0.22)',
      position: mobile ? 'fixed' : 'relative',
      top: mobile ? 0 : 'auto',
      left: mobile ? 0 : 'auto',
      right: mobile ? 0 : 'auto',
      bottom: mobile ? 0 : 'auto',
    }
  },
    React.createElement(StatusBarSpacer),
    screen !== 'onboarding' && !mobile && React.createElement(StatusBar),
    React.createElement('div', { style: { flex: 1, overflowY: 'auto', overflowX: 'hidden' } },
      children
    )
  );
}

// ── Main App ──────────────────────────────────────────────────────
function App() {
  // Load persisted state
  const saved = loadState();

  const [screen,      setScreen]      = useState(saved && saved.userData ? 'dashboard' : 'onboarding');
  const [userData,    setUserData]    = useState(saved ? saved.userData    : null);
  const [dailyGoals,  setDailyGoals]  = useState(saved ? saved.dailyGoals  : { ...DEFAULT_DAILY_GOALS });
  const [dailyLog,    setDailyLog]    = useState(saved ? saved.dailyLog    : []);
  const [foodLibrary, setFoodLibrary] = useState(saved && saved.foodLibrary ? saved.foodLibrary.filter(f => f.custom) : []);
  const [navMealName, setNavMealName] = useState('');
  const [addMealKey,  setAddMealKey]  = useState(0);
  const [savedCart,   setSavedCart]   = useState([]);
  const [prevScreen,  setPrevScreen]  = useState('dashboard');
  const [editingMealId, setEditingMealId] = useState(null);
  const [notifications, setNotifications] = useState(saved && saved.notifications ? saved.notifications : []);
  const [notifPrefs, setNotifPrefs] = useState(saved && saved.notifPrefs ? saved.notifPrefs : DEFAULT_NOTIF_PREFS);

  // Persist with debounce to avoid writing on every keystroke
  useEffect(() => {
    const t = setTimeout(() => {
      saveState({ userData, dailyGoals, dailyLog, foodLibrary, notifications, notifPrefs });
    }, 500);
    return () => clearTimeout(t);
  }, [userData, dailyGoals, dailyLog, foodLibrary, notifications, notifPrefs]);

  function navigate(s, mealName = '') {
    if (s === 'add') {
      if (mealName) {
        // Fresh meal started from dashboard shortcut
        setNavMealName(mealName);
        setSavedCart([]);
        setEditingMealId(null);
        setAddMealKey(k => k + 1);
      } else if (screen !== 'library') {
        // Navigating to add from anywhere except library: reset cart
        setNavMealName('');
        setSavedCart([]);
        setEditingMealId(null);
        setAddMealKey(k => k + 1);
      }
      // Returning from library → keep navMealName, savedCart and editing state intact
    } else {
      if (s !== 'library') setNavMealName('');
      if (s === 'dashboard') { setSavedCart([]); setEditingMealId(null); setPrevScreen('dashboard'); }
    }
    setScreen(s);
  }

  // Open AddMeal in edit mode for an existing meal: prefill cart and name.
  // The original meal's date/time are preserved by handleUpdateMeal on save.
  function startEditMeal(meal) {
    setNavMealName(meal.name || '');
    setSavedCart(meal.foods || []);
    setEditingMealId(meal.id);
    setAddMealKey(k => k + 1);
    setPrevScreen('dashboard');
    setScreen('add');
  }

  function handleOnboardingComplete(data, suggestedGoals) {
    setUserData(data);
    if (suggestedGoals) setDailyGoals(suggestedGoals);
    setScreen('dashboard');
  }

  function handleAddMeal(meal) {
    setDailyLog(prev => [...prev, meal]);
  }

  function handleUpdateMeal(updatedMeal) {
    // Spread the original entry first so date/time are kept; updatedMeal overrides
    // name/foods/totals/id but doesn't carry date/time fields.
    setDailyLog(prev => prev.map(m => m.id === updatedMeal.id ? { ...m, ...updatedMeal } : m));
  }

  function handleDeleteMeal(id) {
    setDailyLog(prev => prev.filter(m => m.id !== id));
  }

  function handleUpdateLibrary(newLibrary) {
    setFoodLibrary(newLibrary);
  }

  function handleUpdateGoals(newGoals) {
    setDailyGoals(newGoals);
  }

  function handleUpdateUserData(updater) {
    setUserData(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      return next;
    });
  }

  function handleLogout() {
    if (window.confirm('¿Cerrar sesión? Esto borrará todos tus datos.')) {
      localStorage.removeItem(STORAGE_KEY);
      setUserData(null);
      setDailyLog([]);
      setDailyGoals({ ...DEFAULT_DAILY_GOALS });
      setFoodLibrary([]);
      setNotifications([]);
      setNotifPrefs(DEFAULT_NOTIF_PREFS);
      setScreen('onboarding');
    }
  }

  // ── Notification helpers ──
  function handleMarkRead(id) {
    setNotifications(prev => prev.map(n => n.id === id ? { ...n, read: true } : n));
  }
  function handleMarkAllRead() {
    setNotifications(prev => prev.map(n => ({ ...n, read: true })));
  }
  function handleClearAll() {
    setNotifications([]);
  }
  function handleNotifAction(action) {
    if (action.screen) navigate(action.screen, action.mealName || '');
  }
  function handleUpdateNotifPrefs(newPrefs) {
    setNotifPrefs(newPrefs);
  }

  // Re-render at local midnight so "today" rolls over without leaving stale
  // meals visible. Keeps a tick state that bumps each new day.
  const [, setDayTick] = useState(0);
  useEffect(() => {
    const now = new Date();
    const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
    const ms = nextMidnight - now;
    const t = setTimeout(() => setDayTick(n => n + 1), ms);
    return () => clearTimeout(t);
  });

  const today = localDateKey(new Date());
  const todayMeals = dailyLog.filter(m => m.date === today);
  const unreadCount = notifications.filter(n => !n.read).length;

  // Generate notifications on load and periodically.
  // Pause the interval while the tab is hidden so we don't burn cycles checking
  // reminders in the background, and re-run immediately when it becomes visible.
  // Use a ref to access latest state inside the interval without resetting it
  // every time meals/goals/notifications change (which would skip the timer).
  const genRef = React.useRef(null);
  genRef.current = () => {
    if (!userData || !notifPrefs || !notifPrefs.enabled) return;
    const newNotifs = generateAppNotifications(todayMeals, dailyGoals, dailyLog, userData, notifications, notifPrefs);
    if (newNotifs.length > 0) setNotifications(prev => [...newNotifs, ...prev].slice(0, 50));
  };
  useEffect(() => {
    if (!userData) return;
    function runGen() { if (genRef.current) genRef.current(); }
    let iv = null;
    function start() {
      if (iv) return;
      runGen();
      iv = setInterval(runGen, 5 * 60 * 1000);
    }
    function stop() {
      if (iv) { clearInterval(iv); iv = null; }
    }
    function onVisibility() {
      if (document.visibilityState === 'visible') start();
      else stop();
    }
    if (document.visibilityState === 'visible') start();
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      document.removeEventListener('visibilitychange', onVisibility);
      stop();
    };
  }, [userData && userData.name]);

  // Prepare food list for AddMeal: custom library first, then DB foods not already in library
  function toAddMealFormat(f) {
    const isG = f.unit === 'g';
    return {
      ...f,
      portion: f.portion || (isG ? '100g' : '1 unidad'),
      kcal:    isG ? Math.round((f.kcalPerG || f.kcal) * 100) : f.kcal,
      protein: isG ? parseFloat((f.protein * 100).toFixed(1)) : f.protein,
      fat:     isG ? parseFloat((f.fat     * 100).toFixed(1)) : f.fat,
      carbs:   isG ? parseFloat((f.carbs   * 100).toFixed(1)) : f.carbs,
      sugar:   isG ? parseFloat((f.sugar   * 100).toFixed(1)) : f.sugar,
      kcalPerG: isG ? (f.kcalPerG || f.kcal) : null,
    };
  }
  const customMealFoods = foodLibrary.map(toAddMealFormat);
  const customNames = new Set(foodLibrary.map(f => f.name.toLowerCase()));
  const dbMealFoods = (window.DB_FOODS || [])
    .filter(f => !customNames.has(f.name.toLowerCase()))
    .map(toAddMealFormat);
  const addMealFoods = [...customMealFoods, ...dbMealFoods];

  function renderContent() {
    switch (screen) {
      case 'onboarding':
        return React.createElement(Onboarding, { onComplete: handleOnboardingComplete });

      case 'notifications':
        return React.createElement(NotificationCenter, {
          notifications,
          onMarkRead: handleMarkRead,
          onMarkAllRead: handleMarkAllRead,
          onClearAll: handleClearAll,
          onAction: handleNotifAction,
          onBack: () => navigate('dashboard'),
          onOpenSettings: () => navigate('profile'),
        });

      case 'add':
        return React.createElement(AddMeal, {
          key:           addMealKey,
          onBack:        () => navigate('dashboard'),
          onAddMeal:     handleAddMeal,
          onUpdateMeal:  handleUpdateMeal,
          onGoToLibrary: (cartSnapshot) => { setSavedCart(cartSnapshot); setPrevScreen('add'); navigate('library'); },
          mealName:      navMealName,
          foodLibrary:   addMealFoods,
          initialCart:   savedCart,
          editingMealId,
        });

      case 'library':
        return React.createElement(FoodLibrary, {
          onBack:          () => navigate(prevScreen === 'add' ? 'add' : 'dashboard'),
          library:         foodLibrary,
          onUpdateLibrary: handleUpdateLibrary,
        });

      case 'weekly':
        return React.createElement(WeeklyAnalysis, {
          onBack:         () => navigate('progress'),
          dailyLog,
          dailyGoals,
          userData,
          onUpdateGoals:  handleUpdateGoals,
        });

      case 'progress':
        return React.createElement('div', null,
          React.createElement(Progress, { dailyLog, dailyGoals }),
          React.createElement('div', { style: { padding: '0 16px 20px' } },
            React.createElement('button', {
              onClick: () => navigate('weekly'),
              style: { width: '100%', background: 'white', border: '1.5px solid #EAE0D0', borderRadius: 999, padding: '13px', fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, color: '#1E1408', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }
            },
              React.createElement('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: '#F5D040', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
                React.createElement('polyline', { points: '22 12 18 12 15 21 9 3 6 12 2 12' })
              ),
              'Ver análisis semanal'
            )
          )
        );

      case 'profile':
        return React.createElement(Profile, {
          userData,
          dailyGoals,
          onUpdateGoals:    handleUpdateGoals,
          onNavigate:       navigate,
          onLogout:         handleLogout,
          onUpdateUserData: handleUpdateUserData,
          notifPrefs,
          onUpdateNotifPrefs: handleUpdateNotifPrefs,
        });

      default: // dashboard
        return React.createElement(Dashboard, {
          onNavigate:   navigate,
          userData,
          todayMeals,
          dailyGoals,
          unreadCount,
          onDeleteMeal: handleDeleteMeal,
          onEditMeal:   startEditMeal,
        });
    }
  }

  if (FULLSCREEN.has(screen)) {
    return React.createElement(PhoneShell, { screen },
      renderContent()
    );
  }

  return React.createElement(AppShell, { screen, onNavigate: navigate },
    renderContent()
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
