<!DOCTYPE html>
<!-- Abre este archivo en un navegador, luego haz clic en los botones para descargar los iconos PNG -->
<html>
<head><meta charset="UTF-8"><title>Generar iconos KCALIA</title></head>
<body style="font-family:sans-serif;padding:24px;background:#f5f5f5">
  <h2>Generador de iconos KCALIA</h2>
  <p>Haz clic en cada botón para descargar el ícono. Luego mueve los archivos a la carpeta <code>assets/</code>.</p>
  <div style="display:flex;gap:24px;margin-top:16px;flex-wrap:wrap">
    <div>
      <canvas id="c192" width="192" height="192" style="border-radius:38px;display:block;margin-bottom:8px"></canvas>
      <button onclick="dl('c192','icon-192.png')">Descargar icon-192.png</button>
    </div>
    <div>
      <canvas id="c512" width="512" height="512" style="border-radius:100px;display:block;margin-bottom:8px"></canvas>
      <button onclick="dl('c512','icon-512.png')">Descargar icon-512.png</button>
    </div>
  </div>
  <script>
    function drawIcon(canvas) {
      const s = canvas.width;
      const ctx = canvas.getContext('2d');
      const r = s * 0.18;

      // Background
      ctx.fillStyle = '#F5D040';
      roundRect(ctx, 0, 0, s, s, s * 0.22);
      ctx.fill();

      // Circle ring background
      ctx.beginPath();
      ctx.arc(s/2, s/2, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = s * 0.06;
      ctx.stroke();

      // Circle ring filled arc
      ctx.beginPath();
      ctx.arc(s/2, s/2, r, -Math.PI/2, Math.PI * 1.2);
      ctx.strokeStyle = '#1E1408';
      ctx.lineWidth = s * 0.06;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Letter K
      ctx.fillStyle = '#1E1408';
      ctx.font = `900 ${s * 0.36}px "Arial Black", Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('K', s/2, s/2 + s*0.02);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function dl(id, name) {
      const a = document.createElement('a');
      a.download = name;
      a.href = document.getElementById(id).toDataURL('image/png');
      a.click();
    }

    drawIcon(document.getElementById('c192'));
    drawIcon(document.getElementById('c512'));
  </script>
</body>
</html>
